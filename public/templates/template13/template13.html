<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="template33.css">
</head>
<body>
  <div class="sheet">
    <div class="spine"></div>

    <div class="log-head">
      <div class="ttl">
        <div class="eyebrow oncolor">Boathouse Logbook</div>
        <div class="race oncolor">{{RACE_NAME}}</div>
      </div>
      <div class="meta">
        {{#clubLogo}}<img class="club-logo" src="{{clubLogo}}" alt="Club Logo" />{{/clubLogo}}
        <div class="boat oncolor">{{BOAT_TYPE}} {{BOAT_CODE}} &middot; Out</div>
      </div>
    </div>

    <div class="col-head">
      <span class="h-seat">Seat</span>
      <span class="h-name">Crew Member</span>
      <span class="h-stat">Status</span>
    </div>

    <div class="ledger">
      {{#crewMembers}}
      <div class="entry">
        <span class="seat">{{badge}}</span>
        <span class="name">{{name}}</span>
        <span class="stat"><span class="tick">&#10003;</span>Out</span>
      </div>
      {{/crewMembers}}
    </div>

    <div class="log-foot">
      <span>Logged by <b>{{COACH_NAME}}</b></span>
      <span>{{crewCategory}}</span>
    </div>

    <div class="stamp">
      <div class="s-big">BOAT<br>OUT</div>
      <div class="s-sm">Allerton R.C.</div>
    </div>

  </div>
</body>
</html>
