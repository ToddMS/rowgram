<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="template12.css">
  <title>RowGram — Template 12</title>
</head>
<body>
  <div class="canvas">
    <div class="stripes"></div>

    
    <!-- Grosgrain ribbon -->
    <div class="ribbon"></div>

    <!-- The badge -->
    <div class="badge">
      <span class="eyelet"></span>

      <span class="eyebrow">Official Crew Badge</span>
      <h1 class="race-name">{{RACE_NAME}}</h1>
      <p class="category">{{crewCategory}}</p>
      <div class="rule"></div>

      <div class="crew-section">
        <div class="crew-block">
          {{#hasCox}}
          <div class="cox-row">
            <span class="seat">C</span>
            <span class="name">{{COX_NAME}}</span>
          </div>
          {{/hasCox}}
          <section class="crew-list">
            {{#crewMembersNoCox}}
            <div class="crew-row">
              <span class="seat">{{badge}}</span>
              <span class="name">{{name}}</span>
            </div>
            {{/crewMembersNoCox}}
          </section>
        </div>
      </div>

      <div class="footer-bar">
        <div class="footer-item">
          <span class="coach-label">Coach</span>
          <span class="footer-value">{{COACH_NAME}}</span>
        </div>
        {{#clubLogo}}<img class="club-logo" src="{{clubLogo}}" alt="Club Logo" />{{/clubLogo}}
        {{#RACE_DATE}}
        <div class="footer-item footer-item-right">
          <span class="coach-label">Date</span>
          <span class="footer-value">{{RACE_DATE}}</span>
        </div>
        {{/RACE_DATE}}
      </div>
    </div>
  </div>
</body>
</html>
