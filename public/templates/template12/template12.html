<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="template12.css">
  <title>RowGram — Template 12</title>
</head>
<body>
  <div class="canvas">
    <div class="stripes"></div>

    
    <!-- Grosgrain ribbon -->
    <div class="ribbon"></div>

    <!-- The badge -->
    <div class="badge">
      <span class="eyelet"></span>

      <span class="eyebrow">Official Crew Badge</span>
      <h1 class="race-name">{{RACE_NAME}}</h1>
      <p class="category">{{crewCategory}}</p>
      <div class="rule"></div>

      <section class="crew-list">
        {{#crewMembersNoCox}}
        <div class="crew-row">
          <span class="seat">{{badge}}</span>
          <span class="name">{{name}}</span>
        </div>
        {{/crewMembersNoCox}}
      </section>

      <div class="footer-bar">
        {{#hasCox}}<div class="footer-item"><span class="coach-label">COX</span> {{COX_NAME}}</div>{{/hasCox}}
        <div class="footer-item"><span class="coach-label">COACH</span> {{COACH_NAME}}</div>
      </div>

      {{#clubLogo}}<img class="club-logo" src="{{clubLogo}}" alt="Club Logo" />{{/clubLogo}}
    </div>
  </div>
</body>
</html>
