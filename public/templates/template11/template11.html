<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="template28.css">
  <title>RowGram — Template 28</title>
</head>
<body>
  <div class="canvas">
    <div class="planks">
      <div class="plank"></div><div class="plank"></div><div class="plank"></div>
      <div class="plank"></div><div class="plank"></div><div class="plank"></div>
    </div>
    <div class="plaque">
      <span class="screw s-tl"></span>
      <span class="screw s-tr"></span>
      <span class="screw s-bl"></span>
      <span class="screw s-br"></span>

      <h1 class="race-name">{{RACE_NAME}}</h1>
      <div class="inlay"></div>
      <p class="category">{{crewCategory}}</p>

      {{#clubLogo}}
      <div class="club-charm"><img src="{{clubLogo}}" alt="Club Logo" /></div>
      {{/clubLogo}}

      <div class="roster">
        {{#hasCox}}
        <div class="crew-row">
          <span class="seat">C</span>
          <span class="name">{{COX_NAME}}</span>
        </div>
        {{/hasCox}}
        <section class="crew-list">
          {{#crewMembersNoCox}}
          <div class="crew-row">
            <span class="seat">{{badge}}</span>
            <span class="name">{{name}}</span>
          </div>
          {{/crewMembersNoCox}}
        </section>
      </div>

      <p class="coach"><span class="coach-label">Coach</span> {{COACH_NAME}}</p>
      {{#RACE_DATE}}<p class="race-date"><span class="date-label">Date</span> {{RACE_DATE}}</p>{{/RACE_DATE}}
    </div>
  </div>
</body>
</html>
