<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="template11.css">
  <title>RowGram — Template 11</title>
</head>
<body>
  <div class="canvas">
    <div class="planks">
      <div class="plank"></div>
      <div class="plank"></div>
      <div class="plank"></div>
      <div class="plank"></div>
      <div class="plank"></div>
      <div class="plank"></div>
    </div>

    <div class="plaque">
      <span class="screw s-tl"></span>
      <span class="screw s-tr"></span>
      <span class="screw s-bl"></span>
      <span class="screw s-br"></span>

      <h1 class="race-name">{{RACE_NAME}}</h1>
      <div class="inlay"></div>
      <p class="category">{{crewCategory}} &middot; {{BOAT_TYPE}} {{BOAT_CODE}}</p>

      {{#clubLogo}}<img class="logo-wm" src="{{clubLogo}}" alt="" />{{/clubLogo}}

      <div class="roster">
        {{#hasCox}}
        <div class="cox-row">
          <span class="seat">C</span>
          <span class="name">{{COX_NAME}}</span>
          <span class="leader"></span>
        </div>
        {{/hasCox}}
        <section class="crew-list">
          {{#crewMembersNoCox}}
          <div class="crew-row">
            <span class="seat">{{badge}}</span>
            <span class="name">{{name}}</span>
            <span class="leader"></span>
          </div>
          {{/crewMembersNoCox}}
        </section>
      </div>


      <p class="coach"><span class="coach-label">Coach</span> {{COACH_NAME}}</p>
    </div>
  </div>
</body>
</html>
