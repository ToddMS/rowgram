<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="template10.css">
  <title>RowGram — Template 10</title>
</head>
<body>
  <div class="canvas">

    {{#clubLogo}}<img class="club-logo club-logo-left" src="{{clubLogo}}" alt="Club Logo" />{{/clubLogo}}
    {{#clubLogo}}<img class="club-logo club-logo-right" src="{{clubLogo}}" alt="Club Logo" />{{/clubLogo}}

    <header class="header">
      <h1 class="race-name">{{RACE_NAME}}</h1>
      <p class="category">{{crewCategory}}</p>
    </header>

    <!-- One taped instant photo per crew member -->
    <section class="wall">
      
      {{#crewMembers}}
      <div class="card">
        <span class="pin"></span>
        <div class="photo"><span class="seat">{{badge}}</span></div>
        <span class="name">{{name}}</span>
      </div>
      {{/crewMembers}}
      
    </section>

    <footer class="footer">
      <div class="note note-left">
        <span class="note-pin"></span>
        <span class="coach-label">Coach</span>
        <span class="coach-name">{{COACH_NAME}}</span>
      </div>
      {{#RACE_DATE}}
      <div class="note note-right">
        <span class="note-pin"></span>
        <span class="coach-label">Date</span>
        <span class="coach-name">{{RACE_DATE}}</span>
      </div>
      {{/RACE_DATE}}
    </footer>

    
  </div>
</body>
</html>
