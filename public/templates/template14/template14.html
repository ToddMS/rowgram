<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="template14.css">
</head>
<body>
  <div class="sheet">
    <div class="cartouche">

      <div class="c-head">
        {{#clubLogo}}<img class="club-logo" src="{{clubLogo}}" alt="Club Logo" />{{/clubLogo}}
        <div class="club">{{CLUB_NAME}}</div>
        <div class="race">{{RACE_NAME}}</div>
        <div class="cat">{{crewCategory}}</div>
      </div>

      <div class="c-list">
        {{#crewMembers}}
        <div class="c-row">
          <span class="seat oncolor">{{badge}}</span>
          <span class="name">{{name}}</span>
        </div>
        {{/crewMembers}}
      </div>

      <div class="c-foot">Coach &middot; <b>{{COACH_NAME}}</b>{{#RACE_DATE}} &middot; {{RACE_DATE}}{{/RACE_DATE}}</div>

    </div>
  </div>
</body>
</html>
