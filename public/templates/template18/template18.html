<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="template18.css">
</head>
<body>
  <div class="sheet">

    <div class="selvedge-top">
      <div class="header-stamp">
        <div class="h-left">
          {{#clubLogo}}<img class="club-logo" src="{{clubLogo}}" alt="Club Logo" />{{/clubLogo}}
          <div class="txt">
            <div class="t-label">Crew Lineup &middot; {{BOAT_CODE}}</div>
            <div class="t1">{{RACE_NAME}}</div>
            <div class="t2">{{crewCategory}}</div>
          </div>
        </div>
        <div class="h-right">
          <div class="h-row">
            <div class="t-label">Coach</div>
            <div class="t-value">{{COACH_NAME}}</div>
          </div>
          {{#RACE_DATE}}
          <div class="h-row">
            <div class="t-label">Date</div>
            <div class="t-value">{{RACE_DATE}}</div>
          </div>
          {{/RACE_DATE}}
        </div>
      </div>
    </div>

    <div class="stamp-grid">
      {{#crewMembers}}
      <div class="stamp">
        <div class="stamp-inner">
          <div class="stamp-top">{{seatLabel}}</div>
          <div class="name">{{name}}</div>
          <div class="denom">{{CLUB_NAME}}</div>
        </div>
      </div>
      {{/crewMembers}}
    </div>

    <div class="selvedge-bot">
      <div class="center oncolor">&starf; &starf; &starf;</div>
    </div>

  </div>
</body>
</html>
