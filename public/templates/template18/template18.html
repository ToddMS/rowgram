<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="template18.css">
</head>
<body>
  <div class="sheet">

    <div class="selvedge-top">
      <div class="plate-id">
        {{#clubLogo}}
        <div class="logo-stamp">
          <img class="club-logo" src="{{clubLogo}}" alt="Club Logo" />
        </div>
        {{/clubLogo}}
        <div class="txt">
          <div class="t1 oncolor">{{RACE_NAME}}</div>
          <div class="t2 oncolor">Crew Sheet &middot; Plate {{BOAT_CODE}}</div>
        </div>
      </div>
    </div>

    <div class="stamp-grid">
      {{#crewMembers}}
      <div class="stamp">
        <div class="stamp-inner">
          <div class="stamp-top">Rowing Post</div>
          <span class="seat">{{badge}}</span>
          <div class="name">{{name}}</div>
          <div class="denom">Allerton R.C.</div>
        </div>
      </div>
      {{/crewMembers}}
    </div>

    <div class="selvedge-bot">
      <div class="field oncolor">{{crewCategory}}</div>
      <div class="center oncolor">&starf; &starf; &starf;</div>
      <div class="field oncolor">Coach <b>{{COACH_NAME}}</b></div>
    </div>

  </div>
</body>
</html>
