<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="template8.css">
  <title>RowGram — Template 7</title>
</head>
<body>
  <div class="canvas">

    <header class="header">
      <span class="eyebrow">Crew Lineup</span>
      <h1 class="race-name">{{RACE_NAME}}</h1>
      <p class="category">{{crewCategory}}</p>
    </header>

    <!-- One club oar per rower -->
    <section class="crew-list">
      {{#crewMembers}}
      <div class="crew-row">
        <svg class="oar" viewBox="0 0 112 20" xmlns="http://www.w3.org/2000/svg">
          <path d="M8.38794 1.16484L9.88997 1.03833L37.8401 2.22069L108.592 0.00146411C111.224 -0.0811043 112.557 3.49718 110.655 5.54108C110.126 6.10938 109.424 6.43257 108.692 6.44512L36.4345 7.6833L28.5824 16.1209C27.484 17.3012 26.0455 18.005 24.5272 18.1049L4.39875 19.4301C3.98088 19.4576 3.56178 19.4289 3.15047 19.3447L1.2416 18.9537C0.750095 18.853 0.335233 18.4888 0.131743 17.9793C-0.019843 17.5998 -0.0414008 17.1708 0.0711544 16.7734L3.35077 5.19507C3.59398 4.33643 4.0262 3.55895 4.60768 2.93412C5.03335 2.4767 5.53039 2.11039 6.07396 1.85348L6.38079 1.70846C7.01941 1.40662 7.69736 1.22301 8.38794 1.16484Z" />
        </svg>
        <span class="seat">{{badge}}</span>
        <span class="name">{{name}}</span>
      </div>
      {{/crewMembers}}
    </section>

    <!-- Club logo: center right -->
    <div class="logo-panel">
      {{#clubLogo}}<img class="club-logo" src="{{clubLogo}}" alt="Club Logo" />{{/clubLogo}}
    </div>

    <footer class="footer">
      <div class="coach">
        <span class="coach-label">Coach</span>
        <span class="coach-name">{{COACH_NAME}}</span>
      </div>
    </footer>

  </div>
</body>
</html>
