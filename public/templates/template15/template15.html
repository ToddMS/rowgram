<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="template15.css">
  <title>RowGram — Template 15</title>
</head>
<body>
  <div class="canvas">

    <header class="board-head">
      <span class="eyebrow">Crew Lineup</span>
      <h1 class="race-name">{{RACE_NAME}}</h1>
      <span class="category">{{crewCategory}}</span>
    </header>

    <div class="board-body">
      <section class="crew-list">
        {{#crewMembers}}
        <div class="crew-row"><span class="seat">{{badge}}</span><span class="name">{{name}}</span></div>
        {{/crewMembers}}
      </section>

      <div class="logo-panel">
        {{#clubLogo}}<img class="club-logo" src="{{clubLogo}}" alt="Club Logo" />{{/clubLogo}}
      </div>
    </div>

    <footer class="board-foot">
      <div class="coach">
        <div class="coach-block">
          <span class="coach-label">Coach</span>
          <span class="coach-name">{{COACH_NAME}}</span>
        </div>
        {{#RACE_DATE}}
        <div class="coach-block">
          <span class="coach-label">Date</span>
          <span class="coach-name">{{RACE_DATE}}</span>
        </div>
        {{/RACE_DATE}}
      </div>
    </footer>

  </div>
</body>
</html>
